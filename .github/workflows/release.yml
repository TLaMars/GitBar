name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          includeInvalidCommits: true
          excludeTags: "chore\\(release\\):.*"
          writeToFile: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "GitBar ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.changes }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
